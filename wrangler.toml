# Cloudflare Pages configuration for SodCalc
# Deploy with: npx wrangler pages deploy dist --project-name sodcalc --branch main
name = "sodcalc"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-11"

# Custom domain configuration (after DNS setup):
# 1. Add custom domain in Cloudflare Dashboard > Pages > sodcalc > Custom domains
# 2. Set CNAME record for sodcalc.com pointing to sodcalc.pages.dev